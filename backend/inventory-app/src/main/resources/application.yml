# =====================================================
# Inventario Offline-First - Configuración Spring Boot
# =====================================================
# Runtime: WebFlux (reactive) + R2DBC + PostgreSQL
# Migraciones: Flyway (JDBC en arranque)
# =====================================================

spring:
  application:
    name: inventory-app

  # R2DBC (runtime reactive) - Local PostgreSQL
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/inventory
    username: postgres
    password: postgres
    pool:
      initial-size: 1
      max-size: 5
      max-idle-time: 30m
      max-lifetime: 30m
      max-acquire-time: 5s
      max-create-connection-time: 5s

  # Flyway (JDBC para migraciones) - Local PostgreSQL
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/inventory
    user: postgres
    password: postgres
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Security / JWT
app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-minimum-256-bits-key-here!!}
      access-token-expiration: 900000      # 15 minutos en ms
      refresh-token-expiration: 2592000000  # 30 días en ms

  # Map tiles (PMTiles)
  maps:
    location: ${INVENTORY_MAPS_LOCATION:./maps}

  # Media storage (imágenes)
  media:
    root: ${INVENTORY_MEDIA_ROOT:./media}
    max-avatar-size: 2MB
    max-product-image-size: 10MB
    max-images-per-product: 8

# Logging
logging:
  level:
    com.inventory: INFO
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO

# SpringDoc / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

# Actuator (solo health, sin detalles)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# Profile: dev
spring:
  config:
    activate:
      on-profile: dev
  
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/inventory_dev

  flyway:
    url: jdbc:postgresql://localhost:5432/inventory_dev

logging:
  level:
    com.inventory: INFO

---
# Profile: test
spring:
  config:
    activate:
      on-profile: test

  r2dbc:
    url: r2dbc:tc:postgresql:16:///inventory_test?TC_DAEMON=true

logging:
  level:
    com.inventory: DEBUG
    org.testcontainers: INFO

---
# Profile: prod
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.inventory: INFO
    org.springframework: WARN
